name: HAMYLION CI

on:
  push:
    paths:
      - 'infra/hamylion-core/**'
      - '.github/workflows/hamylion-ci.yml'
  pull_request:
    paths:
      - 'infra/hamylion-core/**'
      - '.github/workflows/hamylion-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://hamylion:hamylion@localhost:5432/hamylion
      REDIS_URL: redis://localhost:6379/0
      HAMYLION_API_KEY: ci-bootstrap-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hamylion
          POSTGRES_USER: hamylion
          POSTGRES_PASSWORD: hamylion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hamylion -d hamylion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: infra/hamylion-core/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: alembic -c ../alembic.ini upgrade head
      - run: alembic -c ../alembic.ini check
      - run: python -m pytest -q
      - run: python -m compileall -q app worker.py provision_api_key.py
      - run: alembic -c ../alembic.ini heads
