name: api-lifecycle

on:
  push:
    paths:
      - 'api-lifecycle/**'
  pull_request:
    paths:
      - 'api-lifecycle/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lifecycle JSON
        run: python - <<'PY'
import json
from pathlib import Path

schema = json.loads(Path('api-lifecycle/schema/lifecycle.json').read_text())
sample = json.loads(Path('api-lifecycle/examples/sample-lifecycle.json').read_text())
required = set(schema['required'])
missing = required - sample.keys()
if missing:
    raise SystemExit(f'missing required fields: {sorted(missing)}')
print('lifecycle sample: OK')
PY
