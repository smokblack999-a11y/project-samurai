name: api-lifecycle

on:
  push:
    paths:
      - 'api-lifecycle/**'
  pull_request:
    paths:
      - 'api-lifecycle/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: api-lifecycle/go.mod
      - name: Format check
        working-directory: api-lifecycle
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: api-lifecycle
        run: go vet ./...
      - name: Test Go core
        working-directory: api-lifecycle
        run: go test ./...
      - name: Build CLIs
        working-directory: api-lifecycle
        run: go build ./cmd/samurai-lifecycle ./cmd/samurai-audit ./cmd/samurai-inventory ./cmd/samurai-e2e ./cmd/samurai-bundle
      - name: End-to-end audit smoke test
        working-directory: api-lifecycle
        run: |
          go run ./cmd/samurai-e2e \
            -openapi examples/e2e-openapi.json \
            -logs examples/e2e-access-log.jsonl \
            -endpoint /v1/orders \
            -method GET \
            -out /tmp/evidence.json > /tmp/report.html
          test -s /tmp/evidence.json
          test -s /tmp/report.html
          go run ./cmd/samurai-bundle -in /tmp/evidence.json -out /tmp/bundle.json
          test -s /tmp/bundle.json
          python - <<'PY'
import json
for p in ['/tmp/evidence.json','/tmp/bundle.json']:
    e=json.load(open(p))
    print(p, 'OK')
e=json.load(open('/tmp/evidence.json'))
b=json.load(open('/tmp/bundle.json'))
assert e['endpoint']=='/v1/orders'
assert e['method']=='GET'
assert e['decision'] in {'SAFE','REVIEW','BLOCKED'}
assert b['schema_version']=='1.0'
assert b['priority'] in {'normal','high','critical'}
assert b['evidence_fingerprint']
assert b['actions']
print('e2e remediation bundle: OK', b['priority'])
PY
      - name: API lifecycle risk gate
        run: |
          decision=$(python - <<'PY'
import json
print(json.load(open('/tmp/evidence.json')).get('decision',''))
PY
          )
          case "$decision" in
            BLOCKED)
              echo "::error title=API lifecycle blocked::Retirement evidence is BLOCKED"
              exit 1
              ;;
            REVIEW)
              echo "::warning title=API lifecycle review::Retirement requires human review"
              ;;
            SAFE)
              echo "API lifecycle gate: SAFE"
              ;;
            *)
              echo "::error title=API lifecycle invalid::Missing or invalid decision"
              exit 1
              ;;
          esac
      - name: OpenAPI inventory smoke test
        working-directory: api-lifecycle
        run: test "$(go run ./cmd/samurai-inventory -openapi examples/openapi.json | python -c 'import json,sys; print(len(json.load(sys.stdin)))')" -eq 4
      - name: Validate lifecycle JSON
        run: python - <<'PY'
import json
from pathlib import Path
schema = json.loads(Path('api-lifecycle/schema/lifecycle.json').read_text())
sample = json.loads(Path('api-lifecycle/examples/sample-lifecycle.json').read_text())
required = set(schema['required'])
missing = required - sample.keys()
if missing:
    raise SystemExit(f'missing required fields: {sorted(missing)}')
print('lifecycle sample: OK')
PY
      - name: Validate risk result schema
        run: python - <<'PY'
import json
from pathlib import Path
schema = json.loads(Path('api-lifecycle/schema/risk-result.json').read_text())
required = set(schema['required'])
if required != {'decision','score','confidence','reasons','remediations'}:
    raise SystemExit('risk-result schema contract changed unexpectedly')
print('risk result schema: OK')
PY
