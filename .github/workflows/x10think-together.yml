name: x10think-together

on:
  push:
    branches: ["feat/x10think-together-hardening-v2"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -U pytest
      - name: Run X10THINK tests
        run: python -m pytest -q x10think/tests
