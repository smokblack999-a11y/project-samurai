name: hamylion-core
on:
  push:
    paths:
      - 'infra/hamylion-core/**'
      - '.github/workflows/hamylion.yml'
  pull_request:
    paths:
      - 'infra/hamylion-core/**'
      - '.github/workflows/hamylion.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/hamylion-core/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app worker.py migrations tests
