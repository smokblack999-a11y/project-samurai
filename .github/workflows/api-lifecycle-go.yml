name: api-lifecycle-go
on:
  push:
    branches: [main, feat/api-lifecycle-mvp]
  pull_request:
    paths:
      - 'api-lifecycle/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-lifecycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: gofmt -w internal cmd
      - run: go test ./...
      - run: go vet ./...
