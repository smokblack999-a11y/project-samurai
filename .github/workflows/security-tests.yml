name: Project Samurai API Security Tests

on:
  push:
    branches: ["main", "security/**"]
    paths:
      - "src/api.py"
      - "src/config.py"
      - "test_api_security.py"
      - ".github/workflows/security-tests.yml"
  pull_request:
    paths:
      - "src/api.py"
      - "src/config.py"
      - "test_api_security.py"
      - ".github/workflows/security-tests.yml"

permissions:
  contents: read

jobs:
  api-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run API security regression tests
        run: python -m unittest -v test_api_security
      - name: Compile Python sources
        run: python -m compileall -q src test_api_security.py
