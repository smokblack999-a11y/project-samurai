name: AgentCheck

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_agentcheck.py
      - run: python -m agentcheck.cli scan agentcheck --format json
