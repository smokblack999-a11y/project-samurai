name: Delivery CRM CI

on:
  pull_request:
    paths:
      - "delivery_crm/**"
      - ".github/workflows/delivery-crm.yml"
  push:
    branches:
      - "recovery/delivery-crm-mvp-2026-11"
    paths:
      - "delivery_crm/**"
      - ".github/workflows/delivery-crm.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r delivery_crm/requirements.txt pytest
      - run: python -m compileall -q delivery_crm
      - run: python -m pytest -q delivery_crm/tests
