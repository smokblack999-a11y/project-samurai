name: X10THINK

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: x10think-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q x10think
      - name: Run tests
        run: python -m pytest -q
      - name: Run local scan smoke test
        run: PYTHONPATH=. python -m x10think.run scan
