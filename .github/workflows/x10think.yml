name: x10think

on:
  push:
    paths: ['x10think/**']
  pull_request:
    paths: ['x10think/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x10think
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python doctor.py
