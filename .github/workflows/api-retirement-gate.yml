name: API Retirement Gate

on:
  pull_request:
    paths:
      - 'api-lifecycle/**'
      - '.github/workflows/api-retirement-gate.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  retirement-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-lifecycle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: api-lifecycle/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Retirement gate
        run: go run ./cmd/samurai-ci -input examples/lifecycle.json -json
