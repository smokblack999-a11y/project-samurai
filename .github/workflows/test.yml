name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go run ./cmd/samurai audit --format json target.json
      - run: go run ./cmd/samurai audit --format json --fail-on high target-bad.json
        continue-on-error: true
