name: X10THINK CI

on:
  push:
    branches: [x10think-mvp]
    paths:
      - 'x10think/**'
      - '.github/workflows/x10think-ci.yml'
  pull_request:
    paths:
      - 'x10think/**'
      - '.github/workflows/x10think-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x10think
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run policy and pipeline tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
