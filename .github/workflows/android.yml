name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake cmake libffi-dev libltdl-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 libssl-dev libtool pkg-config \
            unzip zip zlib1g-dev

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.2.13676358"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK=$ANDROID_NDK"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt2" version
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/aidl" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==3.0.11

      - name: Build debug APK
        working-directory: android
        run: |
          set -euxo pipefail
          rm -rf .buildozer
          buildozer -v android debug

      - name: Verify APK
        working-directory: android
        run: |
          set -euxo pipefail
          ls -lah bin/
          APK=$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK=$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stockscan-debug-apk
          path: android/bin/*.apk
          if-no-files-found: error
