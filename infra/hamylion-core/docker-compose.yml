services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hamylion
      POSTGRES_USER: hamylion
      POSTGRES_PASSWORD: hamylion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamylion -d hamylion"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis_data:/data]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:hamylion@postgres:5432/hamylion
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:hamylion@postgres:5432/hamylion
      REDIS_URL: redis://redis:6379/0
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:-hm_dev_change_me}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-300}
      HAMYLION_OUTBOUND_ALLOWED_HOSTS: ${HAMYLION_OUTBOUND_ALLOWED_HOSTS:-api.coingecko.com}
      HAMYLION_OUTBOUND_TIMEOUT_SECONDS: ${HAMYLION_OUTBOUND_TIMEOUT_SECONDS:-10}
      HAMYLION_OUTBOUND_MAX_RESPONSE_BYTES: ${HAMYLION_OUTBOUND_MAX_RESPONSE_BYTES:-1048576}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:hamylion@postgres:5432/hamylion
      REDIS_URL: redis://redis:6379/0
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:-hm_dev_change_me}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-300}
      HAMYLION_WORKER_NAME: ${HAMYLION_WORKER_NAME:-worker-1}
      RECOVERY_IDLE_MS: ${RECOVERY_IDLE_MS:-30000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data: {}
  redis_data: {}
