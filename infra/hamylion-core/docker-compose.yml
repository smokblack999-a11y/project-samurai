services:
  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/hamylion
      REDIS_URL: redis://redis:6379/0
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:?Set HAMYLION_API_KEY in environment}
      AUTO_CREATE_SCHEMA: "false"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    build: ./backend
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/hamylion
      REDIS_URL: redis://redis:6379/0
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:?Set HAMYLION_API_KEY in environment}
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hamylion
      POSTGRES_USER: hamylion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamylion -d hamylion"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    volumes: [redis_data:/data]
volumes:
  postgres_data: {}
  redis_data: {}
