services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:hamylion@postgres:5432/hamylion
      REDIS_URL: redis://redis:6379/0
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:-hm_dev_change_me}
    depends_on: [postgres,redis]
  worker:
    build: ./backend
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+asyncpg://hamylion:hamylion@postgres:5432/hamylion
      REDIS_URL: redis://redis:6379/0
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:-hm_dev_change_me}
    depends_on: [postgres,redis]
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: hamylion,POSTGRES_USER: hamylion,POSTGRES_PASSWORD: hamylion}
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    volumes: [redis_data:/data]
volumes: {postgres_data: {},redis_data: {}}
