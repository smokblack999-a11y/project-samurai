services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \\$POSTGRES_USER -d \\$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis_data:/data]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${HAMYLION_DATABASE_URL:?HAMYLION_DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    environment:
      DATABASE_URL: ${HAMYLION_DATABASE_URL:?HAMYLION_DATABASE_URL must be set}
      REDIS_URL: ${HAMYLION_REDIS_URL:?HAMYLION_REDIS_URL must be set}
      HAMYLION_API_KEY: ${HAMYLION_API_KEY:?HAMYLION_API_KEY must be set}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      HAMYLION_GITHUB_ALLOWED_REPOSITORIES: ${HAMYLION_GITHUB_ALLOWED_REPOSITORIES:-}
      HAMYLION_WEBHOOK_MAX_BODY_BYTES: ${HAMYLION_WEBHOOK_MAX_BODY_BYTES:-2097152}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-300}
      HAMYLION_OUTBOUND_ALLOWED_HOSTS: ${HAMYLION_OUTBOUND_ALLOWED_HOSTS:-api.coingecko.com}
      HAMYLION_OUTBOUND_TIMEOUT_SECONDS: ${HAMYLION_OUTBOUND_TIMEOUT_SECONDS:-10}
      HAMYLION_OUTBOUND_MAX_RESPONSE_BYTES: ${HAMYLION_OUTBOUND_MAX_RESPONSE_BYTES:-1048576}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python worker.py
    environment:
      DATABASE_URL: ${HAMYLION_DATABASE_URL:?HAMYLION_DATABASE_URL must be set}
      REDIS_URL: ${HAMYLION_REDIS_URL:?HAMYLION_REDIS_URL must be set}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
      RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-300}
      HAMYLION_WORKER_NAME: ${HAMYLION_WORKER_NAME:-worker-1}
      RECOVERY_IDLE_MS: ${RECOVERY_IDLE_MS:-30000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data: {}
  redis_data: {}
